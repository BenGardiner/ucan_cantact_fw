name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/gcc-arm-none-eabi-8-2019-q3-update.cmake

      - name: Build cantact_fw
        run: make -C build cantact_fw

      - name: Generate HEX file
        run: arm-none-eabi-objcopy -O ihex build/cantact_fw build/cantact_fw.hex

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cantact_fw
          path: |
            build/cantact_fw.bin
            build/cantact_fw.hex
